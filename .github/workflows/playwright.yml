name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Never queue two runs for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory: `eslint .` currently reports 33 pre-existing errors (the eslint
      # config only defines browser globals, so server code trips no-undef on
      # `process`/`console`). Flip to blocking once those are triaged.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      # /api/trending and /api/search call the YouTube Data API. Without a key the
      # home page renders no tracks and the shelf tests have nothing to click.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The trend cache is in-memory only, so a fresh CI container has no data to
      # serve. Fail here with a readable error instead of 30s timeouts per test.
      - name: Check YOUTUBE_API_KEY secret
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository/app secret YOUTUBE_API_KEY is missing; /api/trending needs it or the home page has no tracks to click."
            exit 1
          fi

      # playwright.config.js webServer boots both the API (:3000) and Vite (:5173).
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  e2e-cross-browser:
    name: E2E (firefox, webkit, mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    continue-on-error: true
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # "Mobile Chrome" is a Chromium device, so Chromium is needed here too.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check YOUTUBE_API_KEY secret
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository/app secret YOUTUBE_API_KEY is missing; /api/trending needs it or the home page has no tracks to click."
            exit 1
          fi

      # Known-failing today: firefox/webkit lose the player bar after the second
      # playback and Mobile Chrome/Safari hang on clicks (no <=860px layout).
      # Non-blocking until those app-side issues are fixed.
      - name: Run Playwright tests
        run: >
          npx playwright test
          --project=firefox
          --project=webkit
          --project="Mobile Chrome"
          --project="Mobile Safari"

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 7
